[project]
name = "agentic-sql-assistant"
version = "0.1.0"
description = "AI Agent with tool calling, multi-step reasoning, and full observability"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<2",
    "langchain>=0.3,<2",
    "langchain-core>=0.3,<2",
    "langchain-ollama>=0.2,<2",
    "langchain-qdrant>=0.2,<2",
    # src/observability uses the Langfuse v2 API (client.trace / trace.span).
    "langfuse>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.0,<6",
    # Direct dependency so the CPU-only index below applies (no CUDA wheels).
    "torch>=2.2,<3",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "ruff>=0.7,<1",
    "mypy>=1.13,<3",
    "pyyaml>=6.0,<7",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint.per-file-ignores]
# Prompt templates contain long literal example lines that must not be re-wrapped.
"src/agent/prompts.py" = ["E501"]
